# Build a signed APK and publish it as a GitHub Release whenever a tag like v1.2.3 is pushed.
# The app's Settings → "Zkontrolovat aktualizace" downloads the APK from the latest release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SIGNING_KEYSTORE_BASE64   base64 of the release .jks keystore
#   SIGNING_STORE_PASSWORD    keystore password
#   SIGNING_KEY_ALIAS         key alias
#   SIGNING_KEY_PASSWORD      key password
name: Release APK

# Every push to main publishes a release vX.Y.<run number> (base X.Y is appVersionBase in
# gradle.properties). Pushing a tag v1.2.3 publishes exactly that version instead.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.apk.outputs.version }}
    env:
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Ensure fonts (Google Fonts, OFL)
        run: |
          mkdir -p app/src/main/res/font
          missing=0
          dl() { [ -f "app/src/main/res/font/$1" ] || { curl -sSfL -o "app/src/main/res/font/$1" "$2"; missing=1; }; }
          dl space_grotesk.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
          dl manrope.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf"
          echo "FONTS_ADDED=$missing" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        if: ${{ env.HAS_KEY == 'true' }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        id: apk
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            BASE=$(grep '^appVersionBase=' gradle.properties | cut -d= -f2)
            VERSION="$BASE.${{ github.run_number }}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          chmod +x gradlew
          set -o pipefail
          ./gradlew :shared:test testPosReleaseUnitTest --stacktrace 2>&1 | tee build.log
          ./gradlew assembleRelease --stacktrace -PversionName="$VERSION" -PversionCode="${{ github.run_number }}" 2>&1 | tee -a build.log
          mkdir -p dist
          cp app/build/outputs/apk/pos/release/app-pos-release.apk "dist/ZapoKredit-$VERSION.apk"
          cp app/build/outputs/apk/klic/release/app-klic-release.apk "dist/ZapoKredit-Klic-$VERSION.apk"
          cp app/build/outputs/apk/cisnik/release/app-cisnik-release.apk "dist/ZapoKredit-Cisnik-$VERSION.apk"

      - name: Commit downloaded fonts back to the repo
        if: ${{ success() && env.FONTS_ADDED == '1' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/res/font
          git commit -m "Add fonts (Space Grotesk, Manrope – OFL)" && git push || true

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -vE "^> Task|^\s*at " build.log | grep -E "^e: |What went wrong|error|Error|Could not|Caused by|^> [A-Z]" -A2 | head -80 > err.txt || true
          echo "::error title=Build errors::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' err.txt)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: ZapoKredit ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          # register APK first: older versions of the in-app updater take the first non-"Klic" APK
          files: |
            dist/ZapoKredit-[0-9]*.apk
            dist/ZapoKredit-Klic-*.apk
            dist/ZapoKredit-Cisnik-*.apk
          generate_release_notes: true

  # Windows register (PC): installer .msi + portable .zip, attached to the same release
  desktop:
    needs: build
    runs-on: windows-latest
    env:
      ZK_DESKTOP_ONLY: "1"
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Windows installer
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :shared:test :desktop:packageMsi :desktop:createDistributable --stacktrace -PdesktopVersion="1.0.${{ github.run_number }}" 2>&1 | tee build.log
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi "dist/ZapoKredit-PC-$VERSION.msi"

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path desktop/build/compose/binaries/main/app/ZapoKredit -DestinationPath "dist/ZapoKredit-PC-$env:VERSION-portable.zip"

      - name: Report build errors as annotations
        if: failure()
        shell: bash
        run: |
          grep -vE "^> Task|^\s*at " build.log | grep -E "^e: |What went wrong|error|Error|Could not|Caused by|^> [A-Z]" -A2 | head -80 > err.txt || true
          echo "::error title=Desktop build errors::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' err.txt)"

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            dist/*.msi
            dist/*.zip
