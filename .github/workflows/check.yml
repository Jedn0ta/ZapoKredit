# Quick compile + tests for work-in-progress branches (no release).
name: Check
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile and test (Android + PC)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :shared:test :desktop:test :app:compilePosDebugKotlin :app:compileCisnikDebugKotlin :app:compileKlicDebugKotlin --continue --stacktrace 2>&1 | tee build.log
      - name: Upload PC screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: desktop/build/screens/*.png
          if-no-files-found: ignore

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -vE "^> Task|^\s*at " build.log | grep -E "^e: |What went wrong|error|Error|Could not|Caused by|FAILED|^> [A-Z]" -A2 | head -150 > err.txt || true
          echo "::error title=Build errors::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' err.txt)"
